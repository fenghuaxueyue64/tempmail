<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云信邮件 — 智能邮件接收与管理平台</title>
  <meta name="description" content="高并发智能邮件接收与管理平台，支持多域名、API 接入、团队隔离" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    // 首屏前应用主题，避免闪烁（与 stores/theme.js 使用相同的存储键）
    (function () {
      try {
        var mode = localStorage.getItem('tm_theme_mode') || (localStorage.getItem('tm_theme') ? 'manual' : 'auto');
        var t = mode === 'auto'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (localStorage.getItem('tm_theme') || 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
